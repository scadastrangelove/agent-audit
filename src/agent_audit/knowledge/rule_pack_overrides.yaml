  # Editorial note: a few entries are semantic re-categorizations rather
  # than pure renames. For example, rules citing "ASI03 - Tool Misuse"
  # would be more correctly re-mapped to ASI02 "Tool Misuse and
  # Exploitation" in the 1.0.0 taxonomy. The rewrite below only normalizes
  # within the existing ASI ID; deeper recategorization is deferred to a
  # rule-pack-level review (out of scope for the references-rewrite layer).
