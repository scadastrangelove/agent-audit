# Rule Pack Overrides
#
# Severity demotions and suppressions for rule-pack rules that produce too
# much noise to be useful in developer-facing reports without reducing them
# first. Applied by knowledge/rule_pack_loader.py at load time.
#
# Derived from the agent-audit grand-run evaluation (100 repos, 2026-04-21):
# https://docs/ast-precision-plan.md covers the broader FP strategy.
#
# Each entry is:
#   <agent_audit_id>:
#     severity: <new severity>     # overrides severity_default
#     reason: <why we demoted>
#     evidence: <where noise shows up>

rules:
  # Grand-run #1 noisy rule: TOP-1 in 45/91 repos, 801 findings total across 78
  # targets. Fires on any URL-download pattern in docs/READMEs/install
  # instructions. In a skill-audit context, install-URL patterns are usually
  # documentation, not a security control issue. Demoting to LOW so it does
  # not dominate default `--min-severity medium` runs but stays available for
  # signature-harvesting mode.
  aguara.external-download.runtime-url-controls-agent-behavior:
    severity: low
    reason: "Grand-run showed TOP-1 in 45/91 repos; dominates operator experience without corresponding security value."
    evidence: "801 findings across 78 targets; top-ranked noise in e.g. microsoft/generative-ai-for-beginners translations."

  # Binary-download rule has the same character but fires on fewer repos.
  # 56/74 findings on microsoft/generative-ai-for-beginners are this rule —
  # it hits install-from-binary instructions in tutorials. Demote to LOW;
  # a real agent-audit concern about binary install should come from the
  # context (SKILL.md promising to execute arbitrary binaries), not from
  # every mention in a tutorial.
  aguara.external-download.binary-download-and-execute:
    severity: low
    reason: "Fires on install-from-binary documentation in tutorials, not behavioral."
    evidence: "56/74 findings on microsoft/generative-ai-for-beginners."

  # Grand-run #3 by hit count: 338 findings across 57 targets. The regex
  # matches phrases like 'without confirmation', 'always run', 'auto-apply'
  # in arbitrary prose, including instructional tone of voice. When it
  # matters, our native asamm.AD-02.* detectors catch it structurally.
  # Keep the rule available but demote severity.
  atr.agent-manipulation.human-approval-fatigue-exploitation:
    severity: low
    reason: "Prose-tone matcher; native AD-02 detectors catch the real cases structurally."
    evidence: "338 findings across 57 targets; top-1 in 9 repos that were otherwise clean."


# References Rewrites — applied globally at load time before the OWASP MCP
# enrichment runs. Used to track upstream taxonomy drift without editing
# upstream rule YAMLs.
#
# How it works: each entry under `references_rewrite.<field>` is an
# exact-match string replacement on items in that field of every rule's
# references block. Misses pass through unchanged.
#
# Example: MITRE ATLAS renamed several techniques in the v5.x series as part
# of an AI/ML wording sweep. Rather than editing 100+ ATR YAMLs, we map the
# stale strings to the current ATLAS labels here. The B3 atlas-validate
# tool was the trigger.
#
# When a rewrite is no longer needed (e.g. upstream rule YAML was contributed
# back), remove the entry. Validator strict-mode is the regression gate.
references_rewrite:
  mitre_atlas:
    # ATLAS v5.x AI/ML wording sweep (detected by atlas-validate v0.16.0)
    "AML.T0010 - ML Supply Chain Compromise":
      "AML.T0010 - AI Supply Chain Compromise"
    "AML.T0018 - Backdoor ML Model":
      "AML.T0018 - Manipulate AI Model"
    "AML.T0024 - Exfiltration via ML Inference API":
      "AML.T0024 - Exfiltration via AI Inference API"
    "AML.T0040 - ML Model Inference API Access":
      "AML.T0040 - AI Model Inference API Access"
    "AML.T0044 - Full ML Model Access":
      "AML.T0044 - Full AI Model Access"
    "AML.T0046 - Spamming ML System with Chaff Data":
      "AML.T0046 - Spamming AI System with Chaff Data"
    "AML.T0047 - ML-Enabled Product or Service":
      "AML.T0047 - AI-Enabled Product or Service"
    # Note: AML.T0048 was substantively re-scoped, not just renamed.
    # Old name "Adversarial Prompt Techniques" → new "External Harms".
    # We rewrite for taxonomy consistency; revisit during quarterly refresh
    # whether the underlying rules still belong under T0048.
    "AML.T0048 - Adversarial Prompt Techniques":
      "AML.T0048 - External Harms"
    "AML.T0051 - Prompt Injection":
      "AML.T0051 - LLM Prompt Injection"
    "AML.T0051.001 - Indirect Prompt Injection":
      "AML.T0051.001 - Indirect"
    # Notable: T0053 was renamed from "LLM Plugin Compromise" to
    # "AI Agent Tool Invocation" — the ATLAS team's recognition that
    # MCP-style tool invocation is a distinct primitive.
    "AML.T0053 - LLM Plugin Compromise":
      "AML.T0053 - AI Agent Tool Invocation"
    "AML.T0056 - LLM Meta Prompt Extraction":
      "AML.T0056 - Extract LLM System Prompt"

  # OWASP Top 10 for Agentic Applications wording sweep — drift from
  # late-2025 drafts to the 1.0.0 release in December 2025. ATR rules
  # were authored across both periods; some cite draft names. The
  # rewrite normalizes everything to the 1.0.0 canonical names.
  #
  # Generated programmatically from owasp-agentic-validate first run
  # (Roadmap B2). Dual entries (ASInn and ASInn:2026) cover both citation
  # styles seen in the rule packs.
