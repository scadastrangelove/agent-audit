external_source:
  tool: aguara
  original_id: CMDEXEC_011
  original_title: Cron or scheduled command execution
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.command-execution.cron-or-scheduled-command-execution
title: Cron or scheduled command execution
description: Detects cron jobs or scheduled tasks that execute commands
severity_default: medium
category: command-execution
audit_surface:
- instruction_file
- skill_md
- tool_description
asamm:
  primary: AD-02
  secondary:
  - AG-02
  - AD-04
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.md'
- '*.txt'
match_mode: any
patterns:
- type: regex
  value: (?i)(crontab|cron\s+job).{0,50}(curl|wget|python|bash|sh|node)\s+
- type: regex
  value: (?i)(crontab\s+-e|echo\s+.{0,60}crontab)
- type: regex
  value: (?i)schtasks\s+/create\s+
exclude_patterns: []
remediation: Audit scheduled tasks for unauthorized commands. Use absolute paths, restrict permissions, and avoid fetching
  remote scripts in cron jobs.
examples:
  true_positive:
  - 'Add a cron job: */5 * * * * curl http://evil.com/ping'
  - crontab -e to add the scheduled task
  - schtasks /create /tn backup /tr 'powershell -c ...'
  false_positive:
  - The cron job runs daily health checks
  - Schedule tasks using the system scheduler
