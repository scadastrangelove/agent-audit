external_source:
  tool: aguara
  original_id: INDIRECT_010
  original_title: Unscoped Bash tool in allowed tools
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.command-execution.unscoped-bash-tool-in-allowed-tools
title: Unscoped Bash tool in allowed tools
description: Detects skills that include unscoped Bash in their allowed tools list (not Bash(cmd:*) scoped)
severity_default: low
category: command-execution
audit_surface:
- instruction_file
- skill_md
- tool_description
asamm:
  primary: AD-02
  secondary:
  - AG-02
  - AD-04
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.md'
- '*.txt'
match_mode: any
patterns:
- type: regex
  value: (?im)allowed.?tools[^\n]*\bBash[\s,]
- type: regex
  value: (?is)allowed.?tools.{0,200}\- Bash\s
exclude_patterns: []
remediation: Scope Bash access with command prefixes (e.g., Bash(npm:*)) instead of granting unrestricted shell access.
examples:
  true_positive:
  - 'allowed-tools: Bash, Read, Write, Edit'
  - "allowed-tools:\n  - Bash\n  - Read"
  false_positive:
  - The bash shell is used for scripting
  - 'allowed-tools: Bash(npm:*) Read Write'
