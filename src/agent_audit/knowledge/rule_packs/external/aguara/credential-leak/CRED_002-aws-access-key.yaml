external_source:
  tool: aguara
  original_id: CRED_002
  original_title: AWS access key
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.credential-leak.aws-access-key
title: AWS access key
description: Detects AWS access key IDs
severity_default: critical
category: credential-leak
audit_surface:
- instruction_file
- skill_md
- tool_description
- mcp_manifest
asamm:
  primary: AG-03
  secondary:
  - AI-03
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
match_mode: any
patterns:
- type: regex
  value: AKIA[0-9A-Z]{16}
exclude_patterns: []
remediation: Use IAM roles or AWS Secrets Manager instead of hardcoded access keys. Rotate compromised keys immediately via
  the AWS console.
examples:
  true_positive:
  - aws_access_key_id = AKIAIOSFODNN7EXAMPLE
  false_positive:
  - The format is AKIA followed by 16 characters
