external_source:
  tool: aguara
  original_id: CRED_007
  original_title: Hardcoded password
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.credential-leak.hardcoded-password
title: Hardcoded password
description: Detects hardcoded passwords in code
severity_default: high
category: credential-leak
audit_surface:
- instruction_file
- skill_md
- tool_description
- mcp_manifest
asamm:
  primary: AG-03
  secondary:
  - AI-03
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.py'
- '*.js'
- '*.ts'
- '*.go'
- '*.java'
- '*.rb'
- '*.sh'
match_mode: any
patterns:
- type: regex
  value: (?i)(password|passwd|pwd)\s*[=:]\s*["'][^"'\s]{8,}["']
- type: regex
  value: (?i)(password|passwd|pwd)\s*=\s*["'][^"']{8,}["']
exclude_patterns: []
remediation: Use environment variables or a secrets manager instead of hardcoded passwords. Rotate any exposed passwords immediately.
examples:
  true_positive:
  - password = 'supersecret123'
  - DB_PASSWORD="MyS3cretP@ss"
  false_positive:
  - password = os.getenv('DB_PASSWORD')
  - 'password = input(''Enter password: '')'
