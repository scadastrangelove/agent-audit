external_source:
  tool: aguara
  original_id: CRED_009
  original_title: GCP service account key
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.credential-leak.gcp-service-account-key
title: GCP service account key
description: Detects Google Cloud Platform service account credentials
severity_default: critical
category: credential-leak
audit_surface:
- instruction_file
- skill_md
- tool_description
- mcp_manifest
asamm:
  primary: AG-03
  secondary:
  - AI-03
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
match_mode: any
patterns:
- type: regex
  value: '"type"\s*:\s*"service_account"'
- type: regex
  value: '"private_key"\s*:\s*"-----BEGIN'
exclude_patterns: []
remediation: Use Workload Identity Federation instead of service account key files. If keys are required, store them in a
  secrets manager.
examples:
  true_positive:
  - '{"type": "service_account", "project_id": "my-project"}'
  false_positive:
  - Account type can be service_account or user
