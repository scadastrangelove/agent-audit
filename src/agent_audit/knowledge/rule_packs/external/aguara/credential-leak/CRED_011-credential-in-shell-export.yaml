external_source:
  tool: aguara
  original_id: CRED_011
  original_title: Credential in shell export
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.credential-leak.credential-in-shell-export
title: Credential in shell export
description: Detects API keys or tokens exposed in shell export commands
severity_default: high
category: credential-leak
audit_surface:
- instruction_file
- skill_md
- tool_description
- mcp_manifest
asamm:
  primary: AG-03
  secondary:
  - AI-03
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.md'
- '*.txt'
match_mode: any
patterns:
- type: regex
  value: (?i)export\s+[A-Z_]*(API[_-]?KEY|SECRET|TOKEN|PASSWORD|CREDENTIAL)[A-Z_]*\s*=\s*["']?(sk-|ghp_|gho_|AKIA|xox[bpas]-|glpat-|pypi-)[a-zA-Z0-9_\-]{20,}
- type: regex
  value: (?i)export\s+[A-Z_]*(API[_-]?KEY|SECRET|TOKEN)[A-Z_]*\s*=\s*["'][a-zA-Z0-9_\-]{30,}["']
exclude_patterns: []
remediation: Use a .env file (added to .gitignore) or a secrets manager. Replace inline values with placeholder references
  in docs.
examples:
  true_positive:
  - export OPENROUTER_API_KEY="sk-or-v1-abc123def456ghi789jkl012mno345pqr678"
  - export GITHUB_TOKEN="ghp_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijkl"
  false_positive:
  - export OPENROUTER_API_KEY="sk-or-v1-..."
  - export API_KEY="your-key-here"
