external_source:
  tool: aguara
  original_id: CRED_012
  original_title: Stripe API key
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.credential-leak.stripe-api-key
title: Stripe API key
description: Detects Stripe live and test API keys
severity_default: critical
category: credential-leak
audit_surface:
- instruction_file
- skill_md
- tool_description
- mcp_manifest
asamm:
  primary: AG-03
  secondary:
  - AI-03
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
match_mode: any
patterns:
- type: regex
  value: sk_live_[a-zA-Z0-9]{24,}
- type: regex
  value: sk_test_[a-zA-Z0-9]{24,}
- type: regex
  value: pk_live_[a-zA-Z0-9]{24,}
- type: regex
  value: rk_live_[a-zA-Z0-9]{24,}
exclude_patterns: []
remediation: Store Stripe keys in environment variables. Roll the key immediately in the Stripe dashboard if it was exposed.
examples:
  true_positive:
  - STRIPE_KEY=pk_live_00000000000000000000fake
  - STRIPE_PK=pk_live_aabbccddeeff00112233fake
  false_positive:
  - Set your STRIPE_KEY=sk_test_... in .env
  - Stripe keys start with sk_live_ prefix
