agent_audit_id: aguara.credential-leak.anthropic-api-key
title: Anthropic API key
description: Detects Anthropic API keys
severity_default: critical
category: credential-leak
audit_surface:
- instruction_file
- skill_md
- tool_description
- mcp_manifest
asamm:
  primary: AG-03
  secondary:
  - AI-03
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
match_mode: any
patterns:
- type: regex
  value: sk-ant-[a-zA-Z0-9_-]{20,}
exclude_patterns: []
remediation: Move the Anthropic API key to an environment variable (ANTHROPIC_API_KEY). Regenerate the key if it was exposed.
examples:
  true_positive:
  - ANTHROPIC_API_KEY=sk-ant-api03-abc123def456ghi789
  false_positive:
  - Set ANTHROPIC_API_KEY=sk-ant-... in your environment
