external_source:
  tool: aguara
  original_id: CRED_014
  original_title: SendGrid or Twilio API key
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.credential-leak.sendgrid-or-twilio-api-key
title: SendGrid or Twilio API key
description: Detects SendGrid and Twilio API keys
severity_default: high
category: credential-leak
audit_surface:
- instruction_file
- skill_md
- tool_description
- mcp_manifest
asamm:
  primary: AG-03
  secondary:
  - AI-03
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
match_mode: any
patterns:
- type: regex
  value: SG\.[a-zA-Z0-9_-]{22,}\.[a-zA-Z0-9_-]{20,}
- type: regex
  value: SK[a-f0-9]{32}
exclude_patterns: []
remediation: Store SendGrid/Twilio API keys in environment variables or a secrets manager. Rotate exposed keys immediately.
examples:
  true_positive:
  - SENDGRID_API_KEY=SG.fake00key00example00fake.fake00secret00example00val
  - TWILIO_AUTH=SK00000000000000000000000000000000
  false_positive:
  - SendGrid keys start with SG. prefix
