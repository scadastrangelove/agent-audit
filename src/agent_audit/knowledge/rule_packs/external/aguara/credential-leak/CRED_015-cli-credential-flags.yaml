external_source:
  tool: aguara
  original_id: CRED_015
  original_title: CLI credential flags
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.credential-leak.cli-credential-flags
title: CLI credential flags
description: Detects command-line flags passing credentials with real-looking values
severity_default: medium
category: credential-leak
audit_surface:
- instruction_file
- skill_md
- tool_description
- mcp_manifest
asamm:
  primary: AG-03
  secondary:
  - AI-03
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.md'
- '*.txt'
match_mode: any
patterns:
- type: regex
  value: (?i)--(password|passwd|api-key|api_key|secret|token|auth)\s*[=]\s*["']?[a-zA-Z0-9_!@#$%^&*-]{12,}["']?
exclude_patterns: []
remediation: Pass credentials via environment variables or config files instead of CLI flags. Use placeholders like $VAR in
  documentation.
examples:
  true_positive:
  - --password=MyS3cretP@ssw0rd123
  - --api-key=abcdef1234567890abcdef12
  false_positive:
  - --password=<your-password>
  - --api-key=$API_KEY
  - --token=${TOKEN}
