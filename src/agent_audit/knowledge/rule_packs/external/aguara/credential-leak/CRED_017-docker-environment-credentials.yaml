external_source:
  tool: aguara
  original_id: CRED_017
  original_title: Docker environment credentials
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.credential-leak.docker-environment-credentials
title: Docker environment credentials
description: Detects Docker or docker-compose commands passing credentials via environment variables
severity_default: low
category: credential-leak
audit_surface:
- instruction_file
- skill_md
- tool_description
- mcp_manifest
asamm:
  primary: AG-03
  secondary:
  - AI-03
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.md'
- '*.txt'
- '*.yaml'
- '*.yml'
match_mode: any
patterns:
- type: regex
  value: (?i)(docker\s+run|docker-compose|docker\s+create)\s+.{0,100}-e\s+["']?[A-Z_]*(PASSWORD|SECRET|TOKEN|API_KEY|CREDENTIAL)[A-Z_]*\s*=
- type: regex
  value: (?i)environment:\s*\n(\s+-\s+[A-Z_]*=.+\n)*\s+-\s+[A-Z_]*(PASSWORD|SECRET|TOKEN|API_KEY|CREDENTIAL)[A-Z_]*\s*=
exclude_patterns:
- type: regex
  value: (?i)(PASSWORD|SECRET|TOKEN|API_KEY|CREDENTIAL)[A-Z_]*\s*=\s*["']?(<|\$\{|your[_-]|xxx|placeholder|changeme)
- type: regex
  value: (?i)(PASSWORD|SECRET|TOKEN|API_KEY|CREDENTIAL)[A-Z_]*\s*=["']?\s*$
remediation: Use Docker secrets or an .env file (not committed) instead of passing credentials via -e flags.
examples:
  true_positive:
  - docker run -e DATABASE_PASSWORD=mysecret123 myimage
  - docker run -e API_KEY=sk_live_abc123def456 myimage
  false_positive:
  - docker run -e NODE_ENV=production myimage
  - docker run -e PORT=3000 myimage
  - docker run -e API_KEY=your-key-here myimage
