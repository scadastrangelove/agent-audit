external_source:
  tool: aguara
  original_id: CRED_018
  original_title: Credential logging without redaction
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.credential-leak.credential-logging-without-redaction
title: Credential logging without redaction
description: Detects code that logs API keys, tokens, or secrets to console or logger without redaction
severity_default: high
category: credential-leak
audit_surface:
- instruction_file
- skill_md
- tool_description
- mcp_manifest
asamm:
  primary: AG-03
  secondary:
  - AI-03
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.py'
- '*.js'
- '*.ts'
- '*.go'
- '*.java'
- '*.rb'
match_mode: any
patterns:
- type: regex
  value: (?i)(console\.(log|error|warn|info)|log(ger)?\.(info|warn|error|debug)|print|fmt\.Print)\s*\([^)]*\b(api[_-]?key|secret[_-]?key|auth[_-]?token|password|bearer)\b
- type: regex
  value: (?i)(console\.(log|error)|log(ger)?\.(error|info))\s*\([^)]*\b(req|request)\.(headers|body)\b
- type: regex
  value: (?i)(console\.(log|error)|print)\s*\(.*?(sk-|ghp_|gho_|AKIA|xox[bpas]-|glpat-|Bearer\s)
exclude_patterns: []
remediation: Redact or mask credentials before logging. Use structured logging with a sanitizer that strips sensitive fields.
examples:
  true_positive:
  - console.log('API key:', apiKey)
  - 'logger.info(''Auth token: '' + user.auth_token)'
  - console.error('Debug:', request.headers)
  - 'print(f''Using key: sk-ant-api03-...'')'
  false_positive:
  - console.log('Processing request...')
  - logger.info('Request completed')
  - Redact sensitive fields before logging
