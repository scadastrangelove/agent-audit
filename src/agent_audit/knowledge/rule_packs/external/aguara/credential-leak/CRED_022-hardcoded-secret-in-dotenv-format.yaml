external_source:
  tool: aguara
  original_id: CRED_022
  original_title: Hardcoded secret in dotenv format
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.credential-leak.hardcoded-secret-in-dotenv-format
title: Hardcoded secret in dotenv format
description: Detects hardcoded secrets using known key prefixes in .env-style assignments
severity_default: high
category: credential-leak
audit_surface:
- instruction_file
- skill_md
- tool_description
- mcp_manifest
asamm:
  primary: AG-03
  secondary:
  - AI-03
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.env'
- '*.env.*'
- '*.md'
- '*.txt'
match_mode: any
patterns:
- type: regex
  value: (?i)[A-Z_]*(KEY|SECRET|TOKEN|PASSWORD)\s*=\s*["']?(sk-proj-|ghp_|gho_|xox[bpas]-|glpat-|sk-ant-[a-z]|sk_live_|pk_live_)[a-zA-Z0-9_\-]{20,}
- type: regex
  value: (?i)[A-Z_]*(KEY|SECRET|TOKEN|PASSWORD)\s*=\s*["']?AKIA[0-9A-Z]{16}
- type: regex
  value: (?i)[A-Z_]*(KEY|SECRET|TOKEN|PASSWORD)\s*=\s*["']?SG\.[a-zA-Z0-9_\-.]{20,}
exclude_patterns:
- type: regex
  value: (?i)(your[_-]|example|placeholder|changeme|xxx|fake|dummy|sample|test[_-]?key)
remediation: Replace hardcoded secrets with placeholder values in documentation. Use a secrets manager for actual deployments.
examples:
  true_positive:
  - OPENAI_API_KEY=sk-proj-abc123def456ghi789jkl012mno345pqr678stu901vwx
  - GITHUB_TOKEN=ghp_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijkl
  - AWS_SECRET_KEY=AKIAIOSFODNN7PRODKEY1
  - SENDGRID_API_KEY=SG.nrYSK2nR7kLc9mGPqz.wQksBnR8TkJdLe6m4kZ3q9
  false_positive:
  - OPENAI_API_KEY=sk-your-key-here
  - API_KEY=your-api-key-here
  - Set your SECRET_KEY in the .env file
