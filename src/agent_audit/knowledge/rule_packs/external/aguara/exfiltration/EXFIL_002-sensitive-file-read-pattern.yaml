external_source:
  tool: aguara
  original_id: EXFIL_002
  original_title: Sensitive file read pattern
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.exfiltration.sensitive-file-read-pattern
title: Sensitive file read pattern
description: Detects reads of sensitive system or credential files
severity_default: high
category: exfiltration
audit_surface:
- instruction_file
- skill_md
- tool_description
asamm:
  primary: AI-03
  secondary:
  - AG-03
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
match_mode: any
patterns:
- type: regex
  value: (?i)(read|cat|type|get-content|open|load|include)\s+["']?(/etc/(passwd|shadow|hosts)|~/?\.(ssh|gnupg|aws|azure|gcloud|config|netrc|npmrc|pypirc))
- type: regex
  value: (?i)(read|cat|open|load)\s+["']?.*?(id_rsa|id_ed25519|id_dsa|known_hosts|authorized_keys)
- type: contains
  value: cat ~/.ssh/id_rsa
exclude_patterns: []
remediation: Avoid reading sensitive files. If file access is needed, use an allowlist of permitted paths.
examples:
  true_positive:
  - cat ~/.ssh/id_rsa
  - cat /etc/shadow
  - open ~/.aws/credentials
  false_positive:
  - Ensure ~/.ssh/id_rsa has correct permissions (600)
