external_source:
  tool: aguara
  original_id: EXFIL_011
  original_title: External context or knowledge sync
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.exfiltration.external-context-or-knowledge-sync
title: External context or knowledge sync
description: Detects CLI tools that upload project context, code, or knowledge to external services
severity_default: high
category: exfiltration
audit_surface:
- instruction_file
- skill_md
- tool_description
asamm:
  primary: AI-03
  secondary:
  - AG-03
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.md'
- '*.txt'
match_mode: any
patterns:
- type: regex
  value: (?i)(curate|sync|upload|push|send)\s+.{0,60}-f\s+\S+\.(ts|js|py|go|rb|java|md)
- type: regex
  value: (?i)(curate|sync|upload)\s+["'].{5,}["']\s+(-f|--file)
- type: regex
  value: (?i)(project|code|knowledge|context)\s+.{0,30}(sync|upload|curate|push)\s+.{0,20}(to|with)\s+.{0,30}(external|remote|cloud|server)
- type: regex
  value: (?i)(sync|upload|curate|push)\s+.{0,30}(project|code|knowledge|context).{0,20}(to|with)\s+.{0,30}(external|remote|cloud|server)
exclude_patterns: []
remediation: Audit and remove commands that sync project code to external services. Use version control for code sharing instead.
examples:
  true_positive:
  - brv curate "Auth uses JWT" -f src/auth.ts
  - sync project knowledge to external service
  - Upload code context to remote server
  false_positive:
  - git push origin main
  - Upload the file to S3 for backup
