external_source:
  tool: aguara
  original_id: INDIRECT_008
  original_title: Email or message content as instructions
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.indirect-injection.email-or-message-content-as-instructions
title: Email or message content as instructions
description: Detects skills that read email or message content and act on it as agent instructions
severity_default: high
category: indirect-injection
audit_surface:
- instruction_file
- skill_md
- tool_description
asamm:
  primary: AI-04
  secondary:
  - AI-05
  - AI-03
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.md'
- '*.txt'
match_mode: all
patterns:
- type: regex
  value: (?i)(read|check|fetch|poll|monitor)\s+.{0,30}(email|inbox|message|mail|notification|slack|discord)
- type: regex
  value: (?i)(act|execute|follow)\s+.{0,10}(on|based on)\s+.{0,20}(the\s+)?(content|instructions?|message|body|request)
exclude_patterns: []
remediation: Treat email and message content as untrusted data; never execute instructions embedded in external messages.
examples:
  true_positive:
  - Read the user's email and act on the instructions found
  - Monitor Slack messages and execute based on the message content
  false_positive:
  - Send an email notification when the task is complete
  - Read Slack messages and respond based on context
