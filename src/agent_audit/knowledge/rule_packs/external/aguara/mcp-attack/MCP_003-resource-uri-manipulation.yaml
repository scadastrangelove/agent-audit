external_source:
  tool: aguara
  original_id: MCP_003
  original_title: Resource URI manipulation
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.mcp-attack.resource-uri-manipulation
title: Resource URI manipulation
description: Detects dangerous URI schemes or path traversal in resource fields
severity_default: high
category: mcp-attack
audit_surface:
- mcp_manifest
- tool_description
asamm:
  primary: AG-04
  secondary:
  - AG-05
  - AI-04
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.json'
- '*.yaml'
- '*.yml'
- '*.md'
- '*.txt'
- '*.py'
- '*.js'
- '*.ts'
match_mode: any
patterns:
- type: regex
  value: (?i)["']?(resource|uri|url|href|src)["']?\s*[:=]\s*["']?(file:///|data:|javascript:)
- type: regex
  value: (?i)["']?(resource|uri|path)["']?\s*[:=]\s*["'][^"']*\.\./\.\./[^"']*["']
exclude_patterns: []
remediation: Restrict resource URIs to https:// only. Validate and canonicalize paths to block traversal sequences.
examples:
  true_positive:
  - '"resource": "file:///etc/passwd"'
  - '"uri": "data:text/html,<script>alert(1)</script>"'
  - '"path": "../../etc/shadow"'
  false_positive:
  - '"resource": "https://api.example.com/data"'
  - '"uri": "docs/guide.md"'
