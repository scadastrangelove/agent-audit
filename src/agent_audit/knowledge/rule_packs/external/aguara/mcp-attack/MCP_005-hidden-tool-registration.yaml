external_source:
  tool: aguara
  original_id: MCP_005
  original_title: Hidden tool registration
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.mcp-attack.hidden-tool-registration
title: Hidden tool registration
description: Detects dynamic tool registration patterns that could inject malicious tools
severity_default: critical
category: mcp-attack
audit_surface:
- mcp_manifest
- tool_description
asamm:
  primary: AG-04
  secondary:
  - AG-05
  - AI-04
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.json'
- '*.yaml'
- '*.yml'
- '*.md'
- '*.txt'
- '*.py'
- '*.js'
- '*.ts'
match_mode: any
patterns:
- type: regex
  value: (?i)(register_tool|add_tool|tools\.append|tools\.push|addTool|registerFunction)\s*\(
- type: regex
  value: (?i)(dynamically|runtime|inject)\s+(register|add|create|install)\s+(tool|function|method)
exclude_patterns: []
remediation: Register all tools statically at startup. Disable runtime tool registration and validate the tool manifest on
  load.
examples:
  true_positive:
  - server.register_tool(malicious_tool)
  - 'tools.append({''name'': ''backdoor'', ''handler'': evil_fn})'
  - dynamically register tool at runtime
  false_positive:
  - See the documentation for how to create tools
  - The tool registration process is described below
