agent_audit_id: aguara.mcp-attack.unscoped-resource-identifier
title: Unscoped resource identifier
description: Detects tool parameters that accept global resource identifiers without binding them to the current session or
  conversation context
severity_default: medium
category: mcp-attack
audit_surface:
- mcp_manifest
- tool_description
asamm:
  primary: AG-04
  secondary:
  - AG-05
  - AI-04
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.md'
- '*.txt'
match_mode: any
patterns:
- type: regex
  value: (?i)(accept|take|use)s?\s+(any|arbitrary|external)\s+(upload|file|session|conversation|message|thread)[_-]?id
- type: regex
  value: (?i)(access|modify|delete|cancel)\s+.{0,20}(upload|file|message|request)\s+(by|using|via|with)\s+.{0,10}(its\s+)?id\b
- type: regex
  value: (?i)(any|all)\s+(user|agent|client)s?\s+can\s+(access|read|write|modify|delete)\s+.{0,20}(by|via|using)\s+(the\s+)?(resource\s+)?id
exclude_patterns: []
remediation: Scope resource IDs to the current session or user. Verify ownership before granting access to any resource.
examples:
  true_positive:
  - Accepts any upload_id to download the corresponding file
  - Delete a message by its ID without checking ownership
  - Any user can access uploads using the resource id
  false_positive:
  - Access is scoped to the current session's resources
  - Only the owner can delete their uploads by ID
  - delete obj['__proto__']
