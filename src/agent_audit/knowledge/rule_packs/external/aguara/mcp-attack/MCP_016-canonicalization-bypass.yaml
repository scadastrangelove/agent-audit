external_source:
  tool: aguara
  original_id: MCP_016
  original_title: Canonicalization bypass
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.mcp-attack.canonicalization-bypass
title: Canonicalization bypass
description: Detects double-encoding, manual URL decoding of paths, and authorization bypass via URL encoding tricks
severity_default: high
category: mcp-attack
audit_surface:
- mcp_manifest
- tool_description
asamm:
  primary: AG-04
  secondary:
  - AG-05
  - AI-04
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
match_mode: any
patterns:
- type: regex
  value: (?i)(%252[fF]|%252[eE]|%25252|%2[fF]%2[fF]|%00)
- type: regex
  value: (?i)(QueryUnescape|decodeURI(Component)?|url_?decode|percent_?decode|unquote)\b.{0,40}(path|route|uri|url|endpoint)
- type: regex
  value: (?i)(path|route|url|uri).{0,40}(QueryUnescape|decodeURI(Component)?|url_?decode|percent_?decode|unquote)\b
- type: regex
  value: (?i)(bypass|evade|circumvent|skip)\s+(auth|access|permission|acl).{0,40}(encod|double|percent|url)
- type: regex
  value: (?i)(double|nested|recursive)\s*[- ]?(encod|decod|escape).{0,30}(path|route|url|uri|bypass)
exclude_patterns:
- type: regex
  value: (?i)(prevent|block|detect|mitigat|reject|sanitiz|normaliz|protect).{0,40}(double.?encod|canonicali|path.?travers)
remediation: Canonicalize paths once at the entry point before authorization. Reject requests containing double-encoded sequences.
examples:
  true_positive:
  - Requesting %252F%252E%252E allows directory traversal
  - Use QueryUnescape on the path to normalize before routing
  - Bypass auth using double-encoded URL characters like %252f
  - Apply decodeURIComponent to the path before permission checks
  - Double-encoding the path bypasses ACL checks
  false_positive:
  - Detect and block double-encoding in request paths
  - Sanitize input to prevent canonicalization bypass attacks
  - Normalize paths to protect against path traversal
