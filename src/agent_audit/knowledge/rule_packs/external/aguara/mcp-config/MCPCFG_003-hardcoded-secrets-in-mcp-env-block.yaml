external_source:
  tool: aguara
  original_id: MCPCFG_003
  original_title: Hardcoded secrets in MCP env block
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.mcp-config.hardcoded-secrets-in-mcp-env-block
title: Hardcoded secrets in MCP env block
description: Detects hardcoded API keys, tokens, or passwords in MCP server environment configuration
severity_default: low
category: mcp-config
audit_surface:
- mcp_manifest
asamm:
  primary: AG-04
  secondary:
  - AG-03
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.json'
- '*.md'
- '*.txt'
match_mode: all
patterns:
- type: regex
  value: (?i)["']env["']\s*:\s*\{
- type: regex
  value: (?i)["'][A-Z_]*(API[_-]?KEY|SECRET|TOKEN|PASSWORD|CREDENTIAL)[A-Z_]*["']\s*:\s*["'][a-zA-Z0-9_\-]{20,}["']
exclude_patterns: []
remediation: Use environment variable references (e.g., $ENV_VAR) or a secrets manager instead of hardcoding credentials.
examples:
  true_positive:
  - '{"env": {"API_KEY": "sk-proj-real1234567890abcdef"}}'
  false_positive:
  - '{"env": {"NODE_ENV": "production"}}'
  - '{"env": {"API_KEY": "your-key-here"}}'
