external_source:
  tool: aguara
  original_id: MCPCFG_012
  original_title: uvx MCP server without version pin
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.mcp-config.uvx-mcp-server-without-version-pin
title: uvx MCP server without version pin
description: Detects MCP server configs using uvx or uv run to execute packages without version pinning. uvx auto-downloads
  the latest version from PyPI on every run. If a package is compromised, uvx pulls the malicious version automatically.
severity_default: high
category: mcp-config
audit_surface:
- mcp_manifest
asamm:
  primary: AG-04
  secondary:
  - AG-03
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.json'
- '*.md'
- '*.txt'
match_mode: any
patterns:
- type: regex
  value: (?i)["']command["']\s*:\s*["'](uvx|uv)["']
- type: regex
  value: (?i)claude\s+mcp\s+add\s+\S+\s+--\s+uvx\s+
- type: regex
  value: (?i)uvx\s+run\s+[a-zA-Z][a-zA-Z0-9_-]+
exclude_patterns:
- type: regex
  value: (?i)uvx\s+run\s+\S+@\d
- type: regex
  value: (?i)\S+@\d+\.\d+
remediation: 'Pin uvx packages to exact versions: uvx run some-package@1.2.3. Or use a lockfile with hashes.'
examples:
  true_positive:
  - '"command": "uvx", "args": ["litellm", "--proxy"]'
  - '"command": "uv", "args": ["run", "some-mcp-server"]'
  - claude mcp add myserver -- uvx some-mcp-server
  - uvx run mcp-server-github
  false_positive:
  - '"command": "python", "args": ["server.py"]'
  - uvx run some-package@2.0.0 --flag
