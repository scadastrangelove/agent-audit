external_source:
  tool: aguara
  original_id: MCPCFG_013
  original_title: pip install without hash verification in MCP server setup
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.mcp-config.pip-install-without-hash-verification-in-mcp-server-setup
title: pip install without hash verification in MCP server setup
description: Detects pip install commands in MCP server setup instructions that install specific packages without --require-hashes,
  allowing compromised versions from PyPI.
severity_default: medium
category: mcp-config
audit_surface:
- mcp_manifest
asamm:
  primary: AG-04
  secondary:
  - AG-03
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.md'
- '*.txt'
- '*.sh'
match_mode: any
patterns:
- type: regex
  value: (?i)pip\s+install\s+[a-zA-Z][a-zA-Z0-9_-]*(\s+[a-zA-Z][a-zA-Z0-9_-]*)*\s*$
exclude_patterns:
- type: regex
  value: (?i)--require-hashes
- type: regex
  value: (?i)^\s*#
- type: regex
  value: (?i)(pip|uv)\s+install\s+-r\s+
remediation: Use pip install --require-hashes -r requirements.txt with a lockfile that includes SHA-256 hashes for every package.
examples:
  true_positive:
  - pip install litellm mcp-server-tools
  - pip install some-mcp-package
  false_positive:
  - pip install --require-hashes -r requirements.txt
  - pip install -r requirements.txt
  - '# pip install example-package'
