external_source:
  tool: aguara
  original_id: PROMPT_INJECTION_004
  original_title: Zero-width character obfuscation
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.prompt-injection.zero-width-character-obfuscation
title: Zero-width character obfuscation
description: Detects zero-width characters used to hide content
severity_default: high
category: prompt-injection
audit_surface:
- instruction_file
- skill_md
- tool_description
asamm:
  primary: AI-04
  secondary:
  - AI-05
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.md'
- '*.txt'
match_mode: any
patterns:
- type: regex
  value: '[\x{200B}\x{200C}\x{200D}\x{FEFF}\x{2060}]{2,}'
- type: regex
  value: '[\x{200B}-\x{200F}\x{2028}-\x{202F}\x{2060}-\x{2064}\x{FEFF}]{2,}'
exclude_patterns: []
remediation: Remove zero-width characters from the text. Use a hex editor or `sed` to strip Unicode codepoints U+200B-U+200F,
  U+FEFF.
examples:
  true_positive:
  - Normal text​​​​hidden instructions here
  false_positive:
  - Use zero-width spaces for text layout in typography engines
