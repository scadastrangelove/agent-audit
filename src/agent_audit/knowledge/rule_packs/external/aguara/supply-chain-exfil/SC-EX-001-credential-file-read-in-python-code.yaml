external_source:
  tool: aguara
  original_id: SC-EX-001
  original_title: Credential file read in Python code
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.supply-chain-exfil.credential-file-read-in-python-code
title: Credential file read in Python code
description: Detects Python source code using open(), pathlib.Path, or os.path to read known credential file paths such as
  SSH keys, cloud configs, and database passwords
severity_default: critical
category: supply-chain-exfil
audit_surface:
- instruction_file
- skill_md
- tool_description
asamm:
  primary: AI-03
  secondary:
  - AG-04
  - AG-03
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.py'
- '*.pth'
match_mode: any
patterns:
- type: regex
  value: (?i)(open|read_text|read_bytes|Path)[\s.(].*(\.ssh[/"']|\.aws[/"']|\.kube[/"']|\.env["'\s).]|\.gitconfig|\.git-credentials|\.pgpass|\.my\.cnf|\.npmrc|\.pypirc)
- type: regex
  value: (?i)(open|read_text|Path)[\s.(].*(bash_history|zsh_history|sh_history)
- type: regex
  value: (?i)(open|read_text|Path)[\s.(].*(wallet\.dat|\.bitcoin/|\.ethereum/|\.electrum/)
- type: regex
  value: (?i)(open|read_text|Path)[\s.(].*(private.?key\.pem|server\.key|tls\.key|\.p12)
exclude_patterns:
- type: regex
  value: (?i)^\s*#
- type: regex
  value: (?i)(print|log|warn|debug|info|logger)\s*\(
remediation: Remove direct reads of credential files. Use dedicated secret managers (Vault, AWS Secrets Manager) or environment
  variables instead.
examples:
  true_positive:
  - 'with open(os.path.expanduser("~/.ssh/id_rsa")) as f:'
  - Path.home().joinpath(".aws", "credentials").read_text()
  - open("/home/user/.kube/config", "r").read()
  false_positive:
  - '# Check if ~/.ssh/id_rsa exists before connecting'
  - print("Credentials stored at ~/.aws/credentials")
