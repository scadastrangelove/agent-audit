external_source:
  tool: aguara
  original_id: SC-EX-005
  original_title: Cloud metadata endpoint access in Python
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.supply-chain-exfil.cloud-metadata-endpoint-access-in-python
title: Cloud metadata endpoint access in Python
description: Detects Python code making HTTP requests to cloud metadata endpoints (AWS IMDS, GCP metadata, Azure IMDS) to
  steal container or VM credentials
severity_default: high
category: supply-chain-exfil
audit_surface:
- instruction_file
- skill_md
- tool_description
asamm:
  primary: AI-03
  secondary:
  - AG-04
  - AG-03
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.py'
match_mode: any
patterns:
- type: regex
  value: (?i)(requests|urllib|httpx|http\.client).*169\.254\.169\.254
- type: regex
  value: (?i)(requests|urllib|httpx|http\.client).*metadata\.google\.internal
- type: regex
  value: (?i)Metadata-Flavor:\s*Google
exclude_patterns:
- type: regex
  value: (?i)^\s*#
remediation: Do not query cloud metadata endpoints from application code. Use official SDKs (boto3, google-cloud) which handle
  credential rotation safely.
examples:
  true_positive:
  - r = requests.get("http://169.254.169.254/latest/meta-data/iam/security-credentials/")
  - urllib.request.urlopen("http://metadata.google.internal/computeMetadata/v1/")
  false_positive:
  - '# AWS IMDS endpoint: http://169.254.169.254/latest/meta-data/'
