external_source:
  tool: aguara
  original_id: SC-EX-006
  original_title: Kubernetes secrets API access outside K8s libraries
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.supply-chain-exfil.kubernetes-secrets-api-access-outside-k8s-libraries
title: Kubernetes secrets API access outside K8s libraries
description: Detects Python code reading Kubernetes secrets or creating privileged pods using raw HTTP calls or kubectl, a
  pattern used for lateral movement in cluster attacks
severity_default: critical
category: supply-chain-exfil
audit_surface:
- instruction_file
- skill_md
- tool_description
asamm:
  primary: AI-03
  secondary:
  - AG-04
  - AG-03
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.py'
- '*.yaml'
- '*.yml'
- '*.sh'
match_mode: any
patterns:
- type: regex
  value: (?i)/api/v1/(namespaces/.*/)?secrets
- type: regex
  value: (?i)(kubectl|kubernetes).*get\s+secrets?\s+--all-namespaces
- type: regex
  value: (?i)(kubectl|kubernetes).*create.*pod.*privileged
- type: regex
  value: (?i)/var/run/secrets/kubernetes\.io
- type: regex
  value: (?i)alpine:latest.*hostPath|hostPath.*mountPath:\s*/host
exclude_patterns: []
remediation: Use the official Kubernetes Python client with proper RBAC. Never read secrets across all namespaces. Never create
  privileged pods.
examples:
  true_positive:
  - requests.get(f"{api_url}/api/v1/namespaces/default/secrets", headers=headers)
  - os.popen("kubectl get secrets --all-namespaces -o json").read()
  - '{"image": "alpine:latest", "hostPath": {"path": "/"}, "volumeMounts": [{"mountPath": "/host"}]}'
  false_positive:
  - from kubernetes import client; v1.list_namespaced_secret("default")
