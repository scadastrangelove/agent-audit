external_source:
  tool: aguara
  original_id: SC-EX-008
  original_title: Hardcoded cryptographic key material
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.supply-chain-exfil.hardcoded-cryptographic-key-material
title: Hardcoded cryptographic key material
description: Detects large RSA public keys or crypto key imports hardcoded in Python source, used by supply-chain malware
  to encrypt stolen data before exfiltration
severity_default: high
category: supply-chain-exfil
audit_surface:
- instruction_file
- skill_md
- tool_description
asamm:
  primary: AI-03
  secondary:
  - AG-04
  - AG-03
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.py'
match_mode: any
patterns:
- type: regex
  value: (?i)-----BEGIN (RSA )?PUBLIC KEY-----
- type: regex
  value: (?i)(RSA\.import_key|load_pem_public_key|load_der_public_key)
- type: regex
  value: (?i)(rsa_key|public_key|pub_key)\s*=\s*['"][A-Za-z0-9+/=]{100,}
exclude_patterns:
- type: regex
  value: (?i)^\s*#
remediation: Do not embed cryptographic keys in source code. Use key management services or load keys from secure configuration
  at runtime.
examples:
  true_positive:
  - RSA_KEY = "-----BEGIN PUBLIC KEY-----\nMIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCg..."
  - pub_key = RSA.import_key(b64decode("MIICIjAN..."))
  false_positive:
  - '# -----BEGIN PUBLIC KEY----- (example in docs)'
