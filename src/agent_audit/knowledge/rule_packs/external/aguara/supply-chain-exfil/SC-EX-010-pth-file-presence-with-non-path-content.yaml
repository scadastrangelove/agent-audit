external_source:
  tool: aguara
  original_id: SC-EX-010
  original_title: .pth file presence with non-path content
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.supply-chain-exfil.pth-file-presence-with-non-path-content
title: .pth file presence with non-path content
description: Flags .pth files that contain content beyond simple directory paths for manual review. Skips known-safe ecosystem
  .pth files.
severity_default: medium
category: supply-chain-exfil
audit_surface:
- instruction_file
- skill_md
- tool_description
asamm:
  primary: AI-03
  secondary:
  - AG-04
  - AG-03
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.pth'
match_mode: any
patterns:
- type: regex
  value: (?i)(import|from\s+\w+|def\s+|class\s+|print\(|sys\.|os\.)
exclude_patterns:
- type: contains
  value: import _virtualenv
- type: contains
  value: import _distutils_hack
- type: contains
  value: import coverage
- type: contains
  value: import pkg_resources
remediation: Review .pth file contents. Legitimate .pth files should only contain directory paths (one per line). Any executable
  code should be removed.
examples:
  true_positive:
  - import sys; sys.path.insert(0, '/tmp/evil')
  - from os import system
  false_positive:
  - /usr/local/lib/python3.12/site-packages
  - import _virtualenv
