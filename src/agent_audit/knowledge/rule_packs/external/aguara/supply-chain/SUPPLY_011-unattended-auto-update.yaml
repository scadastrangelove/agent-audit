external_source:
  tool: aguara
  original_id: SUPPLY_011
  original_title: Unattended auto-update
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.supply-chain.unattended-auto-update
title: Unattended auto-update
description: Detects automatic package or skill updates via cron or scheduled tasks without verification
severity_default: high
category: supply-chain
audit_surface:
- instruction_file
- skill_md
- mcp_manifest
- plugin_manifest
asamm:
  primary: AG-04
  secondary:
  - AD-04
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.md'
- '*.txt'
match_mode: any
patterns:
- type: regex
  value: (?i)(npm|pnpm|bun|yarn)\s+update\s+-g\b
- type: regex
  value: (?i)(update|upgrade)\s+--all\b
- type: regex
  value: (?i)cron\s+.{0,80}(update|upgrade|install)\s+.{0,30}(skill|package|plugin|agent)
exclude_patterns: []
remediation: Pin dependency versions and use a lockfile. Review updates manually or via audited CI pipelines.
examples:
  true_positive:
  - npm update -g clawdbot@latest
  - clawdhub update --all
  - Cron job to auto-update all installed skills daily
  false_positive:
  - npm update express
  - Run npm update to check for new versions
