external_source:
  tool: aguara
  original_id: SUPPLY_014
  original_title: Package install from arbitrary URL
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.supply-chain.package-install-from-arbitrary-url
title: Package install from arbitrary URL
description: Detects installing packages directly from URLs instead of registries
severity_default: medium
category: supply-chain
audit_surface:
- instruction_file
- skill_md
- mcp_manifest
- plugin_manifest
asamm:
  primary: AG-04
  secondary:
  - AD-04
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.md'
- '*.txt'
match_mode: any
patterns:
- type: regex
  value: (?i)pip3?\s+install\s+(--user\s+)?https?://[^\s]+
- type: regex
  value: (?i)(npm|yarn|pnpm)\s+(install|add)\s+https?://[^\s]+
- type: regex
  value: (?i)gem\s+install\s+--source\s+https?://[^\s]+
exclude_patterns: []
remediation: Install packages from official registries with pinned versions. Verify checksums for URL-based installs.
examples:
  true_positive:
  - pip install https://github.com/org/repo/archive/main.tar.gz
  - npm install https://github.com/org/package.git
  false_positive:
  - pip install requests
  - npm install express@4.18.2
