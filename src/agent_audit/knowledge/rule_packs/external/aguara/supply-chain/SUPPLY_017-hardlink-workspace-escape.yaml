agent_audit_id: aguara.supply-chain.hardlink-workspace-escape
title: Hardlink workspace escape
description: Detects hardlink creation patterns that bypass realpath-based workspace boundary checks, allowing read/write
  access to files outside the sandbox
severity_default: high
category: supply-chain
audit_surface:
- instruction_file
- skill_md
- mcp_manifest
- plugin_manifest
asamm:
  primary: AG-04
  secondary:
  - AD-04
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
match_mode: any
patterns:
- type: regex
  value: (?i)\bln\s+[/~."][^|;&]{0,60}(etc/|root/|home/|var/run/|\.ssh/|\.aws/|\.env)
- type: regex
  value: (?i)\bln\s+-[^s\s][^|;&]{0,60}(etc/|root/|home/|var/run/|\.ssh/|\.aws/|\.env)
- type: regex
  value: (?i)\b(os\.link|fs\.link(Sync)?|link\()\s*\(
- type: regex
  value: (?i)(hard\s*link|hardlink)\s+.{0,30}(outside|escape|bypass|sensitive|passwd|shadow|secret|credential)
- type: regex
  value: (?i)(create|make|add)\s+(a\s+)?hard\s*links?\s+.{0,30}(to|from|targeting)
exclude_patterns: []
remediation: Block hardlink creation to paths outside the workspace. Validate both source and target with realpath.
examples:
  true_positive:
  - ln /etc/passwd /workspace/myfile
  - os.link('/etc/shadow', '/workspace/shadow_copy')
  - Create a hardlink to escape the sandbox boundary
  - fs.linkSync('/etc/hosts', './hosts_link')
  false_positive:
  - ln -s ./relative/path ./link
  - Symlinks are blocked to prevent workspace escape
  - Hardlink attacks are mitigated by filesystem checks
