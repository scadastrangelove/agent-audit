agent_audit_id: aguara.supply-chain.github-actions-untrusted-input-injection
title: GitHub Actions untrusted input injection
description: 'Detects user-controlled GitHub Actions expressions (${{ ... }}) that may be interpolated into shell commands,
  enabling script injection. These patterns match the expressions themselves, which are dangerous when used anywhere in workflow
  files — not only in run: blocks but also in job names, step names, and other string contexts.'
severity_default: high
category: supply-chain
audit_surface:
- instruction_file
- skill_md
- mcp_manifest
- plugin_manifest
asamm:
  primary: AG-04
  secondary:
  - AD-04
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.yml'
- '*.yaml'
- '*.md'
- '*.txt'
match_mode: any
patterns:
- type: regex
  value: \$\{\{\s*github\.event\.(issue|pull_request|discussion|comment|review|review_comment)\.(title|body)
- type: regex
  value: \$\{\{\s*github\.event\.head_commit\.message
- type: regex
  value: \$\{\{\s*github\.event\.commits\[.*\]\.message
- type: regex
  value: \$\{\{\s*github\.event\.inputs\.
- type: regex
  value: \$\{\{\s*github\.event\.client_payload\.
exclude_patterns: []
remediation: Assign the expression to an environment variable first, then reference the env var in the run block. Never interpolate
  user-controlled event data directly in shell commands.
examples:
  true_positive:
  - 'run: echo ${{ github.event.issue.title }}'
  - 'run: echo "${{ github.event.pull_request.body }}"'
  - 'run: git commit -m "${{ github.event.head_commit.message }}"'
  - 'run: echo ${{ github.event.inputs.name }}'
  - 'run: curl ${{ github.event.client_payload.url }}'
  false_positive:
  - 'run: echo ${{ github.sha }}'
  - 'run: echo ${{ github.repository }}'
  - 'if: github.event.issue.title == ''deploy'''
