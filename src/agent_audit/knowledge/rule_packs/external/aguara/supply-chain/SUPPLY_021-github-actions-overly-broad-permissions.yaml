external_source:
  tool: aguara
  original_id: SUPPLY_021
  original_title: GitHub Actions overly broad permissions
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.supply-chain.github-actions-overly-broad-permissions
title: GitHub Actions overly broad permissions
description: Detects GitHub Actions workflows with write-all or read-all top-level permissions, which grant excessive token
  scope
severity_default: medium
category: supply-chain
audit_surface:
- instruction_file
- skill_md
- mcp_manifest
- plugin_manifest
asamm:
  primary: AG-04
  secondary:
  - AD-04
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.yml'
- '*.yaml'
- '*.md'
- '*.txt'
match_mode: any
patterns:
- type: regex
  value: (?i)permissions\s*:\s*write-all
- type: regex
  value: (?i)permissions\s*:\s*read-all
exclude_patterns: []
remediation: 'Use the principle of least privilege. Declare only the specific permissions needed (e.g., contents: read, issues:
  write) instead of write-all or read-all.'
examples:
  true_positive:
  - 'permissions: write-all'
  - 'permissions: read-all'
  false_positive:
  - 'permissions: contents: read'
  - 'permissions: issues: write'
