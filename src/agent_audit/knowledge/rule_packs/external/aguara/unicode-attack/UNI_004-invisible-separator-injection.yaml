agent_audit_id: aguara.unicode-attack.invisible-separator-injection
title: Invisible separator injection
description: Detects Unicode line/paragraph separators and soft hyphens used to hide content
severity_default: medium
category: unicode-attack
audit_surface:
- instruction_file
- skill_md
- tool_description
- mcp_manifest
asamm:
  primary: AI-04
  secondary:
  - AG-02
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
match_mode: any
patterns:
- type: regex
  value: '[\x{2028}\x{2029}]'
- type: regex
  value: '[\x{00AD}]{2,}'
- type: regex
  value: '[\x{180E}\x{200A}\x{205F}\x{3000}]{3,}'
exclude_patterns: []
remediation: Strip Unicode separators (U+2028, U+2029), soft hyphens (U+00AD), and exotic whitespace before processing input.
examples:
  true_positive:
  - 'visible     hidden on new line'
  - soft­­hyphen hiding
  false_positive:
  - Line separator U+2028 appears in JSON string escaping documentation
