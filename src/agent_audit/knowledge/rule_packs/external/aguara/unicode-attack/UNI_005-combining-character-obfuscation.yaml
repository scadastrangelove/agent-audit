  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.unicode-attack.combining-character-obfuscation
title: Combining character obfuscation
description: Detects excessive combining diacritical marks used to obfuscate text
severity_default: medium
category: unicode-attack
audit_surface:
- instruction_file
- skill_md
- tool_description
- mcp_manifest
asamm:
  primary: AI-04
  secondary:
  - AG-02
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
match_mode: any
patterns:
- type: regex
  value: '[\x{0300}-\x{036F}]{3,}'
- type: regex
  value: '[\x{0300}-\x{036F}\x{20D0}-\x{20FF}]{4,}'
exclude_patterns: []
remediation: Apply Unicode NFC normalization and strip excess combining marks (U+0300-U+036F) beyond one per base character.
examples:
  true_positive:
  - t̀́̂̃est
  false_positive:
  - café
