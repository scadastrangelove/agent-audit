external_source:
  tool: aguara
  original_id: UNI_009
  original_title: Unicode normalization inconsistency
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.unicode-attack.unicode-normalization-inconsistency
title: Unicode normalization inconsistency
description: Detects exploitation of NFC/NFD/NFKC/NFKD normalization differences to bypass string comparisons
severity_default: medium
category: unicode-attack
audit_surface:
- instruction_file
- skill_md
- tool_description
- mcp_manifest
asamm:
  primary: AI-04
  secondary:
  - AG-02
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.md'
- '*.txt'
match_mode: any
patterns:
- type: regex
  value: (?i)(normalize|NFC|NFD|NFKC|NFKD).{0,40}(bypass|evade|trick|confuse|circumvent|avoid)
- type: regex
  value: (?i)(normalization|normalized)\s+.{0,20}(bypass|evasion|attack|inconsisten|mismatch|exploit)
- type: regex
  value: (?i)(bypass|evade|circumvent)\s+.{0,20}(comparison|filter|check|validation|detection)\s+.{0,20}(normali|NFC|NFD|NFKC|NFKD|unicode)
exclude_patterns:
- type: regex
  value: (?i)(sanitize|normalize\s+before|canonical\s+form|normalize\s+input|proper\s+normali)
remediation: Normalize all input to NFC form before any string comparison, filtering, or security check.
examples:
  true_positive:
  - Use NFC normalization differences to bypass string comparison checks
  - Normalization inconsistency exploited to evade keyword filters
  false_positive:
  - Always normalize input to canonical form before comparison
  - Sanitize and normalize before checking user input
