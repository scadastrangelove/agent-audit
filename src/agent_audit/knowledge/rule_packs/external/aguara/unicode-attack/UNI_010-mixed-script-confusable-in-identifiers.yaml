external_source:
  tool: aguara
  original_id: UNI_010
  original_title: Mixed-script confusable in identifiers
  source_version: git-d8797926c0d1
  import_date: '2026-05-03'
  upstream: https://github.com/garagon/aguara
  license: Apache-2.0 (c) 2026 garagon
agent_audit_id: aguara.unicode-attack.mixed-script-confusable-in-identifiers
title: Mixed-script confusable in identifiers
description: Detects mixing Latin with Cyrillic, Greek, or Armenian characters to create lookalike identifiers
severity_default: medium
category: unicode-attack
audit_surface:
- instruction_file
- skill_md
- tool_description
- mcp_manifest
asamm:
  primary: AI-04
  secondary:
  - AG-02
  mapping_confidence: category-default
  notes: Category-level default at import. Review per rule.
targets:
- '*.md'
- '*.txt'
match_mode: any
patterns:
- type: regex
  value: (?i)(mixed.?script|confusable|lookalike|homoglyph).{0,40}(identifier|variable|function|class|domain|url)
- type: regex
  value: (?i)(homoglyph|homograph).{0,20}(attack|spoof|trick|deceive|confuse|imitat)
- type: regex
  value: (?i)(latin|ascii).{0,20}(cyrillic|greek|armenian).{0,20}(same|identical|similar|confus|lookalike|indistinguish)
exclude_patterns:
- type: regex
  value: (?i)(detect|block|prevent|flag|reject|warn)[a-z]*\s+.{0,20}(confusable|mixed.?script|homoglyph|homograph)
remediation: Restrict identifiers to a single Unicode script. Reject or flag strings mixing Latin with Cyrillic, Greek, or
  Armenian.
examples:
  true_positive:
  - Use mixed-script confusable characters in function identifiers to hide malicious code
  - Homoglyph attack using Cyrillic characters in domain names
  false_positive:
  - Detect and block confusable mixed-script identifiers
  - Prevent homoglyph spoofing in user identifiers
