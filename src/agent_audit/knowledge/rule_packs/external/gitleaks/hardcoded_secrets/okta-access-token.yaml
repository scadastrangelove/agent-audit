external_source:
  tool: gitleaks
  original_id: okta-access-token
  original_title: Identified an Okta Access Token, which may compromise identity management services and user authentication
    data
  source_version: git-8863af47d64c
  import_date: '2026-05-03'
  upstream: https://github.com/gitleaks/gitleaks
  license: MIT (c) 2019 Zachary Rice
agent_audit_id: gitleaks.hardcoded_secrets.okta-access-token
title: Identified an Okta Access Token, which may compromise identity management services and user authentication data
description: Identified an Okta Access Token, which may compromise identity management services and user authentication data.
severity_default: high
category: hardcoded_secrets
audit_surface:
- instruction_file
- skill_md
- mcp_manifest
- tool_description
- agent_task_config
asamm:
  primary: AG-03
  secondary:
  - AI-03
  mapping_confidence: category-default
  notes: All Gitleaks rules map to AG-03 secret exposure.
targets:
- '*.md'
- '*.txt'
- '*.json'
- '*.yaml'
- '*.yml'
- '*.toml'
- '*.env'
- '*.env.*'
- '*.cfg'
- '*.ini'
match_mode: any
patterns:
- type: regex
  value: '[\w.-]{0,50}?(?i:[\w.-]{0,50}?(?:(?-i:[Oo]kta|OKTA))(?:[ \t\w.-]{0,20})[\s''"]{0,3})(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60''"\s=]{0,5}(00[\w=\-]{40})(?:[\x60''"\s;]|\\[nr]|$)'
exclude_patterns:
- type: contains
  value: AKIAIOSFODNN7EXAMPLE
- type: contains
  value: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
- type: regex
  value: (?:ghp|gho|ghu|ghs|ghr|github_pat)_[xX]{20,}
- type: regex
  value: (?i)<\s*your[\s_-]*(?:api[\s_-]*)?key[\s_-]*here\s*>
- type: regex
  value: (?i)\bYOUR_[A-Z_]{2,30}_(?:KEY|TOKEN|SECRET)\b
- type: regex
  value: (?i)\bxxx+-xxx+-xxx+\b
- type: contains
  value: 'BEGIN OPENSSH PRIVATE KEY-----

    b3BlbnNza'
- type: contains
  value: sk-proj-EXAMPLE
upstream_entropy_threshold: 4.0
