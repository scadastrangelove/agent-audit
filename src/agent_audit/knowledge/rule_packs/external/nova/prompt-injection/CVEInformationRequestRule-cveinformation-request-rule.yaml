# Severity: low  |  ASAMM: AI-04 (+AI-05)
# Note: NOVA's semantics/llm sections are preserved as metadata
# but not enforced by the current matcher (regex-only).
# =============================================================
external_source:
  tool: nova
  original_id: CVEInformationRequestRule
  original_title: CVEInformationRequestRule
  source_version: git-9249cf49dce2
  import_date: '2026-05-03'
  upstream: https://github.com/Nova-Hunting/nova-rules
  license: MIT (c) 2025 Thomas Roccia
  upstream_uuid: 5ad5eeaf-bcc2-4c4e-a5e0-a26348c287de
  upstream_author: Thomas Roccia
agent_audit_id: nova.prompt-injection.cveinformation-request-rule
title: Detects queries about specific CVE numbers
description: Detects queries about specific CVE numbers
severity_default: low
category: prompt-injection
audit_surface:
- instruction_file
- skill_md
- tool_description
asamm:
  primary: AI-04
  secondary:
  - AI-05
  mapping_confidence: category-default
  notes: Derived from NOVA category mapping at import.
match_mode: any
patterns:
- type: regex
  value: CVE-\d{4}-\d{4,}
- type: regex
  value: (?i)exploit
- type: regex
  value: (?i)vulnerability
- type: regex
  value: (?i)details
- type: regex
  value: (?i)information
- type: regex
  value: (?i)how\ to
- type: regex
  value: (?i)proof\ of\ concept
- type: regex
  value: (?i)POC
exclude_patterns: []
upstream_severity: medium
upstream_semantics_patterns:
- name: cve_inquiry
  prose: requesting details about specific security vulnerabilities by CVE number
  threshold: 0.4
- name: exploit_interest
  prose: seeking information on exploiting known vulnerabilities
  threshold: 0.4
upstream_llm_checks:
- name: cve_check
  prompt: Analyze if this query is requesting specific details about a CVE that could be used for malicious purposes
  threshold: 0.7
upstream_condition_raw: $cve and ($exploit or $vulnerability or $details or $information or $how_to or $poc or $poc_short)
  and (any of semantics.*) and llm.$cve_check
upstream_condition_mapping_note: 'unrecognized condition shape: ''$cve and ($exploit or $vulnerability or $details or $information
  or $how_to or $poc or $poc_short) and (any of semantics.*) and llm.$cve_check''; defaulted to any-of'
upstream_severity_demotion_note: 'Severity floored at LOW on import: NOVA semantics/llm gates are not enforced by the current
  matcher, so keyword-only signal is weaker than upstream intended. Calibration on benign skills showed multi-word keyword
  conjunctions firing on innocuous documentation. Lift selectively when M3 NOVA evaluator lands.'
