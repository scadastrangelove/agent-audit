external_source:
  tool: nova
  original_id: CodeInjectionPrompt
  original_title: CodeInjectionPrompt
  source_version: git-9249cf49dce2
  import_date: '2026-05-03'
  upstream: https://github.com/Nova-Hunting/nova-rules
  license: MIT (c) 2025 Thomas Roccia
  upstream_uuid: 25040029-10a1-4322-9b0a-520b5890a807
  upstream_author: '@fr0gger_'
agent_audit_id: nova.prompt-injection.code-injection-prompt
title: Detects code injection through prompt engineering
description: Detects code injection through prompt engineering
severity_default: low
category: prompt-injection
audit_surface:
- instruction_file
- skill_md
- tool_description
asamm:
  primary: AI-04
  secondary:
  - AI-05
  mapping_confidence: category-default
  notes: Derived from NOVA category mapping at import.
match_mode: any
patterns:
- type: regex
  value: execute (this|the following) code
- type: regex
  value: run (this|the following) code
- type: regex
  value: eval|evaluate (this|the following) code
- type: regex
  value: '```(python|javascript|bash|sh|ruby|php)'
- type: regex
  value: system\(|exec\(|subprocess|os\.system|child_process
exclude_patterns: []
upstream_severity: high
upstream_semantics_patterns:
- name: code_execution
  prose: execute this code
  threshold: 0.5
- name: command_run
  prose: run this command
  threshold: 0.5
upstream_llm_checks:
- name: code_execution_intent
  prompt: Is this prompt trying to get the system to execute code or commands?
  threshold: 0.3
upstream_condition_raw: (keywords.$execute or keywords.$run or keywords.$evaluate) or (keywords.$code_block and keywords.$system_access)
  or semantics.$code_execution or semantics.$command_run or llm.$code_execution_intent
upstream_condition_mapping_note: explicit keyword refs only, any-of
upstream_severity_demotion_note: 'Severity floored at LOW on import: NOVA semantics/llm gates are not enforced by the current
  matcher, so keyword-only signal is weaker than upstream intended. Calibration on benign skills showed multi-word keyword
  conjunctions firing on innocuous documentation. Lift selectively when M3 NOVA evaluator lands.'
