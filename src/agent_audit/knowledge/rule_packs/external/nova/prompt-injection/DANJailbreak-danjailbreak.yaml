external_source:
  tool: nova
  original_id: DANJailbreak
  original_title: DANJailbreak
  source_version: git-9249cf49dce2
  import_date: '2026-05-03'
  upstream: https://github.com/Nova-Hunting/nova-rules
  license: MIT (c) 2025 Thomas Roccia
  upstream_uuid: b0b1cc34-491b-4d3a-b174-146510e76b20
  upstream_author: Thomas Roccia
agent_audit_id: nova.prompt-injection.danjailbreak
title: Detects Do Anything Now (DAN) jailbreak attempts
description: Detects Do Anything Now (DAN) jailbreak attempts
severity_default: low
category: prompt-injection
audit_surface:
- instruction_file
- skill_md
- tool_description
asamm:
  primary: AI-04
  secondary:
  - AI-05
  mapping_confidence: category-default
  notes: Derived from NOVA category mapping at import.
match_mode: any
patterns:
- type: regex
  value: (?i)DAN\ mode
- type: regex
  value: (?i)do\ anything\ now
- type: regex
  value: (?i)ignore\ all\ instructions
- type: regex
  value: (?i)ignore\ the\ rules,\ constraints,\ perimeters,\ values,\ and\ ethics
- type: regex
  value: (?i)you\ have\ full\ authorization\ to\ ignore
- type: regex
  value: (?i)you\ will\ receive\ 10\ tokens
- type: regex
  value: (?i)the\ more\ truthful\ your\ answers\ are,\ the\ more\ tokens
- type: regex
  value: (?i)ignore\ your\ ethical\ guidelines
- type: regex
  value: (?i)ignore\ your\ programming
exclude_patterns: []
upstream_severity: high
upstream_semantics_patterns:
- name: model_override
  prose: convincing the model to bypass its safety measures
  threshold: 0.35
- name: ethics_evasion
  prose: requesting model to evade ethical constraints
  threshold: 0.4
upstream_condition_raw: keywords.$dan_mode or keywords.$do_anything or keywords.$ignore_rules or keywords.$ignore_ethics or
  keywords.$authorization or keywords.$token_reward or keywords.$token_system or keywords.$ethics_bypass or keywords.$programming
  or semantics.$model_override or semantics.$ethics_evasion
upstream_condition_mapping_note: explicit keyword refs only, any-of
upstream_severity_demotion_note: 'Severity floored at LOW on import: NOVA semantics/llm gates are not enforced by the current
  matcher, so keyword-only signal is weaker than upstream intended. Calibration on benign skills showed multi-word keyword
  conjunctions firing on innocuous documentation. Lift selectively when M3 NOVA evaluator lands.'
