external_source:
  tool: nova
  original_id: DataExfiltrationPrompt
  original_title: DataExfiltrationPrompt
  source_version: git-9249cf49dce2
  import_date: '2026-05-03'
  upstream: https://github.com/Nova-Hunting/nova-rules
  license: MIT (c) 2025 Thomas Roccia
  upstream_uuid: 816bf7a0-4d57-45ce-8876-7171f8f254c2
  upstream_author: '@fr0gger_'
agent_audit_id: nova.prompt-injection.data-exfiltration-prompt
title: Detects prompt injection attempts for data exfiltration
description: Detects prompt injection attempts for data exfiltration
severity_default: low
category: prompt-injection
audit_surface:
- instruction_file
- skill_md
- tool_description
asamm:
  primary: AI-04
  secondary:
  - AI-05
  mapping_confidence: category-default
  notes: Derived from NOVA category mapping at import.
match_mode: any
patterns:
- type: regex
  value: send (the|this) (data|information|content) to
- type: regex
  value: exfiltrate|leak|steal|extract data
- type: regex
  value: system prompt|initial instructions|configuration|api key|credentials
- type: regex
  value: (http|https):\/\/[^\s]+|(send|post) to
exclude_patterns: []
upstream_severity: high
upstream_semantics_patterns:
- name: data_extraction
  prose: extract sensitive information
  threshold: 0.4
- name: information_leakage
  prose: reveal confidential data
  threshold: 0.4
upstream_llm_checks:
- name: data_theft_intent
  prompt: Is this prompt attempting to extract sensitive information or system details?
  threshold: 0.35
upstream_condition_raw: (keywords.$send_data and keywords.$external_service) or keywords.$exfil or (keywords.$sensitive_request
  and keywords.$external_service) or semantics.$data_extraction or semantics.$information_leakage or llm.$data_theft_intent
upstream_condition_mapping_note: explicit keyword refs only, any-of
upstream_severity_demotion_note: 'Severity floored at LOW on import: NOVA semantics/llm gates are not enforced by the current
  matcher, so keyword-only signal is weaker than upstream intended. Calibration on benign skills showed multi-word keyword
  conjunctions firing on innocuous documentation. Lift selectively when M3 NOVA evaluator lands.'
