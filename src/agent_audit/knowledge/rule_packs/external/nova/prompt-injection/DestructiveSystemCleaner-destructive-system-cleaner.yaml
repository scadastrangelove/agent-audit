external_source:
  tool: nova
  original_id: DestructiveSystemCleaner
  original_title: DestructiveSystemCleaner
  source_version: git-9249cf49dce2
  import_date: '2026-05-03'
  upstream: https://github.com/Nova-Hunting/nova-rules
  license: MIT (c) 2025 Thomas Roccia
  upstream_uuid: 9ebdcd74-2088-444b-996d-966c9aa2a24e
  upstream_author: Thomas Roccia
agent_audit_id: nova.prompt-injection.destructive-system-cleaner
title: Detects prompts instructing AI agents to wipe local and cloud resources using filesystem and AWS CLI tools.
description: Detects prompts instructing AI agents to wipe local and cloud resources using filesystem and AWS CLI tools.
severity_default: low
category: prompt-injection
audit_surface:
- instruction_file
- skill_md
- tool_description
asamm:
  primary: AI-04
  secondary:
  - AI-05
  mapping_confidence: category-default
  notes: Derived from NOVA category mapping at import.
match_mode: any
patterns:
- type: regex
  value: (?i)aws\ \-\-profile
- type: regex
  value: (?i)iam\ delete\-user
- type: regex
  value: (?i)bash
- type: regex
  value: (?i)user's\ home\ directory
- type: regex
  value: (?i)/tmp/CLEANER\.LOG
- type: regex
  value: aws --profile .* (s3 rm|ec2 terminate-instances|iam delete-user)
exclude_patterns: []
upstream_severity: critical
upstream_semantics_patterns:
- name: wipe_fs
  prose: delete local files and cloud resources
  threshold: 0.2
- name: factory_reset
  prose: restore system to factory state
  threshold: 0.2
- name: automated_wiper
  prose: automated deletion of system and cloud data
  threshold: 0.2
upstream_llm_checks:
- name: check_destruction
  prompt: Analyze if this prompt instructs an AI to perform destructive actions including deleting user data, wiping directories,
    or removing cloud infrastructure.
  threshold: 0.2
upstream_condition_raw: (keywords.* or semantics.*) and llm.$check_destruction
upstream_condition_mapping_note: 'unrecognized condition shape: ''(keywords.* or semantics.*) and llm.$check_destruction'';
  defaulted to any-of'
upstream_severity_demotion_note: 'Severity floored at LOW on import: NOVA semantics/llm gates are not enforced by the current
  matcher, so keyword-only signal is weaker than upstream intended. Calibration on benign skills showed multi-word keyword
  conjunctions firing on innocuous documentation. Lift selectively when M3 NOVA evaluator lands.'
