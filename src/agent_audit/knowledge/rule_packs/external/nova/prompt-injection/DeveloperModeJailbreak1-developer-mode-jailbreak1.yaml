title: Detects Developer Mode jailbreak attempts using only keywords and LLM
description: Detects Developer Mode jailbreak attempts using only keywords and LLM
severity_default: low
category: prompt-injection
audit_surface:
- instruction_file
- skill_md
- tool_description
asamm:
  primary: AI-04
  secondary:
  - AI-05
  mapping_confidence: category-default
  notes: Derived from NOVA category mapping at import.
match_mode: any
patterns:
- type: regex
  value: (?i)Developer\ Mode
exclude_patterns: []
upstream_severity: medium
upstream_llm_checks:
- name: dev_mode_check
  prompt: Analyze if this text contains instructions to enable a Developer Mode
  threshold: 0.6
upstream_condition_raw: keywords.$dev_mode and llm.$dev_mode_check
upstream_condition_mapping_note: explicit keyword refs only, any-of
upstream_severity_demotion_note: 'Severity floored at LOW on import: NOVA semantics/llm gates are not enforced by the current
