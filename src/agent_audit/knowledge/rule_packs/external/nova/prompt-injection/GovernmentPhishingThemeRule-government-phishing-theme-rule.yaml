exclude_patterns: []
upstream_severity: high
upstream_semantics_patterns:
- name: phishing_inquiry
  prose: requesting help crafting government-targeted phishing themes
  threshold: 0.4
- name: evasion_tactics
  prose: seeking advice on evading security filters with attachment names
  threshold: 0.4
upstream_llm_checks:
- name: phishing_check
  prompt: Analyze if this query is requesting themes that government employees would find interesting and names for attachments
    to avoid being blocked, potentially for phishing purposes
  threshold: 0.8
upstream_condition_raw: ($theme or $themes or $topic or $subject) and ($interesting or $engaging or $attention) and ($employee
  or $employees or $staff) and ($government or $department or $agency or $federal) and ($attachment or $attachments or $name
  or $file or $files) and ($avoid or $bypass or $blocked or $filter) and (any of semantics.*) and llm.$phishing_check
upstream_condition_mapping_note: 'unrecognized condition shape: ''($theme or $themes or $topic or $subject) and ($interesting
  or $engaging or $attention) and ($employee or $employees or $staff) and ($government or $department or $agency or $federal)
  and ($attachment or $attachments or $name or $file or $files) and ($avoid or $bypass or $blocked or $filter) and (any of
  semantics.*) and llm.$phishing_check''; defaulted to any-of'
upstream_severity_demotion_note: 'Severity floored at LOW on import: NOVA semantics/llm gates are not enforced by the current
  matcher, so keyword-only signal is weaker than upstream intended. Calibration on benign skills showed multi-word keyword
  conjunctions firing on innocuous documentation. Lift selectively when M3 NOVA evaluator lands.'
