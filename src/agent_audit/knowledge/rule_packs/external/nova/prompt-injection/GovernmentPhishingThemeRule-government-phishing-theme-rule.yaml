- type: regex
  value: (?i)subject
- type: regex
  value: (?i)interesting
- type: regex
  value: (?i)engaging
- type: regex
  value: (?i)attention
- type: regex
  value: (?i)employee
- type: regex
  value: (?i)employees
- type: regex
  value: (?i)staff
- type: regex
  value: (?i)government
- type: regex
  value: (?i)department
- type: regex
