title: Detects requests for effective government-themed phishing content
description: Detects requests for effective government-themed phishing content
severity_default: low
category: prompt-injection
audit_surface:
- instruction_file
- skill_md
- tool_description
asamm:
  primary: AI-04
  secondary:
  - AI-05
  mapping_confidence: category-default
  notes: Derived from NOVA category mapping at import.
match_mode: any
patterns:
- type: regex
  value: (?i)theme
- type: regex
  value: (?i)themes
- type: regex
