external_source:
  tool: nova
  original_id: IndirectPromptInjection
  original_title: IndirectPromptInjection
  source_version: git-9249cf49dce2
  import_date: '2026-05-03'
  upstream: https://github.com/Nova-Hunting/nova-rules
  license: MIT (c) 2025 Thomas Roccia
  upstream_uuid: 22921094-9c2f-4800-be29-d9d756564bc7
  upstream_author: '@fr0gger_'
agent_audit_id: nova.prompt-injection.indirect-prompt-injection
title: Detects indirect prompt injection through external content
description: Detects indirect prompt injection through external content
severity_default: low
category: prompt-injection
audit_surface:
- instruction_file
- skill_md
- tool_description
asamm:
  primary: AI-04
  secondary:
  - AI-05
  mapping_confidence: category-default
  notes: Derived from NOVA category mapping at import.
match_mode: any
patterns:
- type: regex
  value: summarize (this|the) (content|text|document|webpage)
- type: regex
  value: analyze (this|the) (content|text|document|webpage)
- type: regex
  value: review (this|the) (content|text|document|webpage)
- type: regex
  value: hidden text|invisible text|steganography
- type: regex
  value: (http|https):\/\/[^\s]+
exclude_patterns: []
upstream_severity: high
upstream_semantics_patterns:
- name: process_external
  prose: process this external content
  threshold: 0.4
- name: hidden_instructions
  prose: follow instructions in the document
  threshold: 0.4
upstream_llm_checks:
- name: external_content_risk
  prompt: Does this prompt ask to process external content that might contain hidden instructions?
  threshold: 0.35
upstream_condition_raw: ((keywords.$summarize or keywords.$analyze or keywords.$review) and keywords.$external_link) or keywords.$hidden_text
  or semantics.$process_external or semantics.$hidden_instructions or llm.$external_content_risk
upstream_condition_mapping_note: explicit keyword refs only, any-of
upstream_severity_demotion_note: 'Severity floored at LOW on import: NOVA semantics/llm gates are not enforced by the current
  matcher, so keyword-only signal is weaker than upstream intended. Calibration on benign skills showed multi-word keyword
  conjunctions firing on innocuous documentation. Lift selectively when M3 NOVA evaluator lands.'
