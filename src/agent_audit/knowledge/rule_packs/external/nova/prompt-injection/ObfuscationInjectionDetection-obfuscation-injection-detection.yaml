agent_audit_id: nova.prompt-injection.obfuscation-injection-detection
title: Detects obfuscated prompt injection attempts using encoded or altered text
description: Detects obfuscated prompt injection attempts using encoded or altered text
severity_default: low
category: prompt-injection
audit_surface:
- instruction_file
- skill_md
- tool_description
asamm:
  primary: AI-04
  secondary:
  - AI-05
  mapping_confidence: category-default
  notes: Derived from NOVA category mapping at import.
match_mode: any
patterns:
- type: regex
  value: '[A-Za-z0-9+\/=]{20,}'
exclude_patterns: []
upstream_severity: medium
upstream_llm_checks:
- name: obfuscation_check
  prompt: Determine if the text uses obfuscation techniques to hide injection instructions
  threshold: 0.7
upstream_condition_raw: keywords.$base64 or llm.$obfuscation_check
upstream_condition_mapping_note: explicit keyword refs only, any-of
upstream_severity_demotion_note: 'Severity floored at LOW on import: NOVA semantics/llm gates are not enforced by the current
  matcher, so keyword-only signal is weaker than upstream intended. Calibration on benign skills showed multi-word keyword
  conjunctions firing on innocuous documentation. Lift selectively when M3 NOVA evaluator lands.'
