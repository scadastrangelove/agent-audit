  license: MIT (c) 2025 Thomas Roccia
  upstream_uuid: 3c10419e-c579-4c99-825a-9d593e7fec82
  upstream_author: '@tas_kmanager'
agent_audit_id: nova.prompt-injection.phishing-crimson-sandstorm
title: Detection of Crimson Sandstorm phishing prompts, specifically for commonly targeted industries and geographic regions
description: Detection of Crimson Sandstorm phishing prompts, specifically for commonly targeted industries and geographic
  regions
severity_default: low
category: prompt-injection
audit_surface:
- instruction_file
- skill_md
- tool_description
asamm:
  primary: AI-04
  secondary:
  - AI-05
  mapping_confidence: category-default
  notes: Derived from NOVA category mapping at import.
match_mode: any
patterns:
- type: regex
  value: (United States|Turkey|UAE|Israel|Saudi Arabia|Saudi|Kuwait|Bahrain|Jordan|Qatar|Oman|Yemen|american|turkish|emirati|israeli|saudi|kuwaiti|bahraini|jordanian|qatari|omani|yemeni)
- type: regex
  value: (Aviation|Automotive|Aerospace|Defense|Logistics|Maritime|Information Technology|IT|NGO|Development Agency)
- type: regex
  value: (phish|trick|fake|report|invoice|financial|recruitment|job offer|document|agreement|hiring|contract|business|license|access
    card|password|password reset|MFA|2FA|payroll|resume|cv|application|grant|clearance|update|warning|alert|notification|invitation|statement|tax|legal
    notice|compliance|court order|refund|benefit|healthcare|insurance|pension|promotion|request|verification|account|credentials|security
    update|login|bank|wire transfer|remittance)
exclude_patterns: []
upstream_severity: medium
upstream_llm_checks:
- name: phishing
  prompt: Analyze if this prompt attempting to generate either email/message content, pretext, wordings or payload for phishing/spearphishing
    attack? Return a clear yes/no assessment.
  threshold: 0.35
upstream_condition_raw: (keywords.$geo_target and keywords.$industry_target and keywords.$lure) and llm.$phishing
upstream_condition_mapping_note: explicit keyword refs only, any-of
upstream_severity_demotion_note: 'Severity floored at LOW on import: NOVA semantics/llm gates are not enforced by the current
  matcher, so keyword-only signal is weaker than upstream intended. Calibration on benign skills showed multi-word keyword
  conjunctions firing on innocuous documentation. Lift selectively when M3 NOVA evaluator lands.'
