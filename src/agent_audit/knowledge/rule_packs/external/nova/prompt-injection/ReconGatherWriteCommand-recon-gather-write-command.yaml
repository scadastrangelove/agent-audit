external_source:
  tool: nova
  original_id: ReconGatherWriteCommand
  original_title: ReconGatherWriteCommand
  source_version: git-9249cf49dce2
  import_date: '2026-05-03'
  upstream: https://github.com/Nova-Hunting/nova-rules
  license: MIT (c) 2025 Thomas Roccia
  upstream_uuid: 4737c5db-c438-493c-9c74-c2fb19b516c2
  upstream_author: Thomas Roccia
agent_audit_id: nova.prompt-injection.recon-gather-write-command
title: Detects prompts asking to create a one-liner that gathers multiple types of system information and stores it in a specific
  path
description: Detects prompts asking to create a one-liner that gathers multiple types of system information and stores it
  in a specific path
severity_default: low
category: prompt-injection
audit_surface:
- instruction_file
- skill_md
- tool_description
asamm:
  primary: AI-04
  secondary:
  - AI-05
  mapping_confidence: category-default
  notes: Derived from NOVA category mapping at import.
match_mode: any
patterns:
- type: regex
  value: (?i)c:\\\\programdata\\\\info
- type: regex
  value: (?i)c:\\\\programdata\\\\info\\\\info\.txt
- type: regex
  value: (?i)list\ of\ commands
- type: regex
  value: (?i)hardware\ information
- type: regex
  value: (?i)network\ information
- type: regex
  value: (?i)services\ information
- type: regex
  value: (?i)process\ information
- type: regex
  value: (?i)AD\ domain\ information
- type: regex
  value: (?i)in\ one\ line
- type: regex
  value: (?i)>>
exclude_patterns: []
upstream_severity: high
upstream_semantics_patterns:
- name: multi_info_gather
  prose: gather multiple types of computer information into one output
  threshold: 0.2
- name: store_output_file
  prose: save gathered info into a file
  threshold: 0.2
upstream_llm_checks:
- name: llm_recon_command
  prompt: Analyze if this prompt is asking for a one-liner that gathers system, network, or domain information and writes
    the result to a file
  threshold: 0.2
upstream_condition_raw: (keywords.$cmd_list or keywords.$oneline) and (keywords.$hardware or keywords.$network or keywords.$services
  or keywords.$process or keywords.$domain or semantics.$multi_info_gather) and (keywords.$info_path or keywords.$info_file
  or keywords.$redirect or semantics.$store_output_file or llm.$llm_recon_command)
upstream_condition_mapping_note: explicit keyword refs only, any-of
upstream_severity_demotion_note: 'Severity floored at LOW on import: NOVA semantics/llm gates are not enforced by the current
  matcher, so keyword-only signal is weaker than upstream intended. Calibration on benign skills showed multi-word keyword
  conjunctions firing on innocuous documentation. Lift selectively when M3 NOVA evaluator lands.'
