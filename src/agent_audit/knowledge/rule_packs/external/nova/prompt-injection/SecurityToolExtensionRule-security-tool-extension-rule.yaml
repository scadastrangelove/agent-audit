agent_audit_id: nova.prompt-injection.security-tool-extension-rule
title: Detects requests for help developing extensions for cybersecurity tools
description: Detects requests for help developing extensions for cybersecurity tools
severity_default: low
category: prompt-injection
audit_surface:
- instruction_file
- skill_md
- tool_description
asamm:
  primary: AI-04
  secondary:
  - AI-05
  mapping_confidence: category-default
  notes: Derived from NOVA category mapping at import.
match_mode: any
patterns:
- type: regex
  value: (?i)develop
- type: regex
  value: (?i)create
- type: regex
  value: (?i)debug
- type: regex
  value: (?i)extension
- type: regex
  value: (?i)plugin
- type: regex
  value: (?i)module
- type: regex
  value: (?i)addon
- type: regex
  value: (?i)cybersecurity
- type: regex
  value: (?i)security
- type: regex
  value: (?i)pentest
- type: regex
  value: (?i)penetration
- type: regex
  value: (?i)Metasploit
- type: regex
  value: (?i)Burp
- type: regex
  value: (?i)Nmap
- type: regex
  value: (?i)Wireshark
exclude_patterns: []
upstream_severity: medium
upstream_semantics_patterns:
- name: tool_dev_request
  prose: requesting assistance with developing security tool extensions
  threshold: 0.4
- name: security_tool_modification
  prose: seeking help modifying or extending cybersecurity tools
  threshold: 0.4
upstream_llm_checks:
- name: extension_check
  prompt: Analyze if this query is asking for help developing or debugging an extension for a cybersecurity or penetration
    testing tool
  threshold: 0.7
upstream_condition_raw: (any of keywords.* and any of semantics.*) or llm.$extension_check
upstream_condition_mapping_note: mixed condition; keyword side approximated as any-of
upstream_severity_demotion_note: 'Severity floored at LOW on import: NOVA semantics/llm gates are not enforced by the current
  matcher, so keyword-only signal is weaker than upstream intended. Calibration on benign skills showed multi-word keyword
  conjunctions firing on innocuous documentation. Lift selectively when M3 NOVA evaluator lands.'
