external_source:
  tool: nova
  original_id: SimpleNovaRule
  original_title: SimpleNovaRule
  source_version: git-9249cf49dce2
  import_date: '2026-05-03'
  upstream: https://github.com/Nova-Hunting/nova-rules
  license: MIT (c) 2025 Thomas Roccia
  upstream_uuid: 59e50576-91b0-491d-b9f0-5a2a4ea8169a
  upstream_author: Nova User
agent_audit_id: nova.prompt-injection.simple-nova-rule
title: Detects harmful content requests
description: Detects harmful content requests
severity_default: low
category: prompt-injection
audit_surface:
- instruction_file
- skill_md
- tool_description
asamm:
  primary: AI-04
  secondary:
  - AI-05
  mapping_confidence: category-default
  notes: Derived from NOVA category mapping at import.
match_mode: any
patterns:
- type: regex
  value: (?i)hack
- type: regex
  value: (?i)exploit
- type: regex
  value: (?i)vulnerability
exclude_patterns: []
upstream_severity: medium
upstream_semantics_patterns:
- name: malicious_intent
  prose: hacking or unauthorized access
  threshold: 0.35
upstream_llm_checks:
- name: harmful_check
  prompt: Check if this prompt is requesting information on harmful activities
  threshold: 0.35
upstream_condition_raw: any of keywords.* or semantics.$malicious_intent or llm.$harmful_check
upstream_condition_mapping_note: mixed condition; keyword side approximated as any-of
upstream_severity_demotion_note: 'Severity floored at LOW on import: NOVA semantics/llm gates are not enforced by the current
  matcher, so keyword-only signal is weaker than upstream intended. Calibration on benign skills showed multi-word keyword
  conjunctions firing on innocuous documentation. Lift selectively when M3 NOVA evaluator lands.'
